services:
  dhcp:
    image: dnsmasq-dhcp-ui:latest
    build:
      context: .
    container_name: dnsmasq-dhcp-ui
    restart: unless-stopped

    # DHCP 依赖广播，必须使用 host 网络（或改用 docker-compose.macvlan.yml）
    network_mode: host

    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE

    environment:
      # ---- Web 管理 ----
      WEB_PORT: "8080"
      # WEB_USER: "admin"
      # WEB_PASS: "change-me"

      # ---- 首次启动的初始化值；之后以 /data/config.json 为准 ----
      DHCP_INTERFACE: "eth0"        # 留空表示除 lo 外全部接口
      DHCP_RANGE_START: "192.168.1.100"
      DHCP_RANGE_END: "192.168.1.200"
      DHCP_NETMASK: "255.255.255.0"
      DHCP_LEASE_TIME: "24h"
      DHCP_GATEWAY: "192.168.1.1"
      DHCP_DNS: "192.168.1.1, 223.5.5.5"
      DHCP_DOMAIN: "lan"
      DNS_FORWARDERS: "223.5.5.5, 114.114.114.114"
      ONLINE_WINDOW: "900"

    volumes:
      - ./data:/data

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
